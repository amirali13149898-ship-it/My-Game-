<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نقشه بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none; /* جلوگیری از اسکرول صفحه هنگام لمس */
    }
    #map-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    #map {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 0 0;
      touch-action: none;
    }
    #map:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <img id="map" src="https://i.ibb.co/Y4NtgbRZ/map.jpg" alt="نقشه بازی">
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.requestFullscreen();
    tg.disableVerticalSwipes();

    const img = document.getElementById('map');
    const container = document.getElementById('map-container');

    function initPanzoom() {
      const imgWidth = img.naturalWidth;
      const imgHeight = img.naturalHeight;
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // محاسبه مقیاس Cover
      const scaleX = screenWidth / imgWidth;
      const scaleY = screenHeight / imgHeight;
      const coverScale = Math.max(scaleX, scaleY);

      // راه‌اندازی Panzoom (تنها با لمس)
      const panzoom = Panzoom(img, {
        startScale: coverScale,
        minScale: coverScale * 0.8,
        maxScale: coverScale * 4,
        contain: 'outside',
        cursor: 'grab',
        animate: true,
        // غیرفعال کردن زوم با چرخ موس (اختیاری)
        // اما خود کتابخانه به‌طور پیش‌فرض wheel رو هندل نمی‌کنه مگر اینکه ما bind کنیم،
        // بنابراین حذف رویداد wheel کافیه
      });

      // ❌ رویداد چرخ موس را حذف می‌کنیم تا فقط لمس کار کنه
      // container.addEventListener('wheel', panzoom.zoomWithWheel); // حذف شد

      // (اختیاری) برای راحتی می‌تونیم یک دابل‌تپ برای زوم سریع اضافه کنیم (با لمس)
      // اما خود panzoom از دو انگشت برای زوم پشتیبانی می‌کنه
    }

    // بارگذاری مطمئن تصویر (بدون اجرای دوباره)
    if (img.complete) {
      initPanzoom();
    } else {
      img.addEventListener('load', initPanzoom);
    }
  </script>
</body>
</html>

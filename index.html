<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نقشه بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #map-container {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      position: relative;
      background: #222;
    }
    #map {
      display: block;
      width: auto; height: auto;
      max-width: none;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 0 0;
      will-change: transform;
    }
    #map:active { cursor: grabbing; }
    #map.hidden { display: none; }

    #error-msg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(0,0,0,0.85);
      padding: 25px 30px;
      border-radius: 12px;
      text-align: center;
      font-family: sans-serif;
      display: none;
      z-index: 10;
      max-width: 85%;
      direction: rtl;
      backdrop-filter: blur(4px);
      border: 1px solid #555;
    }
    #error-msg button {
      margin-top: 15px;
      padding: 10px 28px;
      background: #4CAF50;
      border: none;
      color: #fff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    #error-msg button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="map-container">
    <img id="map" src="https://i.ibb.co/Y4NtgbRZ/map.jpg" alt="نقشه بازی">
    <div id="error-msg">
      <span id="error-text">خطا در بارگذاری نقشه</span>
      <br><button id="retry-btn">تلاش مجدد</button>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const img = document.getElementById('map');
      const container = document.getElementById('map-container');
      const errorDiv = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');
      const retryBtn = document.getElementById('retry-btn');

      let panzoom = null;
      let loadAttempts = 0;
      const MAX_ATTEMPTS = 3;
      let coverScale = 1;
      let isUserZooming = false;
      let resizeTimer = null;
      let initTimeoutId = null;
      let isInitializing = false;

      function showError(msg) {
        img.classList.add('hidden');
        errorText.textContent = msg || 'خطا در بارگذاری نقشه';
        errorDiv.style.display = 'block';
      }

      function hideError() {
        img.classList.remove('hidden');
        errorDiv.style.display = 'none';
      }

      function addQueryParam(url, key, value) {
        const hasQuery = url.includes('?');
        const separator = hasQuery ? '&' : '?';
        return url + separator + key + '=' + encodeURIComponent(value);
      }

      // ---------- ۱. بررسی وجود Panzoom ----------
      if (typeof Panzoom === 'undefined') {
        showError('کتابخانه نقشه بارگذاری نشد. اتصال اینترنت را بررسی کنید.');
        return;
      }

      // ---------- ۲. راه‌اندازی تلگرام ----------
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();

          if (typeof tg.requestFullscreen === 'function') {
            try {
              const p = tg.requestFullscreen();
              if (p && typeof p.catch === 'function') {
                p.catch(() => {});
              }
            } catch (e) {}
          }
        }
      } catch (e) {}

      // ---------- ۳. محاسبه مقیاس Cover ----------
      function calcCoverScale() {
        if (!img.naturalWidth || !img.naturalHeight) return 1;
        const sw = window.innerWidth;
        const sh = window.innerHeight;
        return Math.max(sw / img.naturalWidth, sh / img.naturalHeight);
      }

      // ---------- ۴. جلوگیری از gestureهای سیستمی ----------
      function gestureHandler(e) {
        if (container.contains(e.target)) e.preventDefault();
      }
      document.addEventListener('gesturestart', gestureHandler, { passive: false });
      document.addEventListener('gesturechange', gestureHandler, { passive: false });
      document.addEventListener('gestureend', gestureHandler, { passive: false });

      // ---------- ۵. تابع اصلی راه‌اندازی Panzoom ----------
      function initPanzoom() {
        if (isInitializing) return;
        isInitializing = true;

        if (initTimeoutId) {
          clearTimeout(initTimeoutId);
          initTimeoutId = null;
        }

        if (panzoom) {
          try { panzoom.destroy(); } catch (e) {}
          panzoom = null;
        }

        if (!img.naturalWidth || !img.naturalHeight) {
          if (loadAttempts < MAX_ATTEMPTS) {
            loadAttempts++;
            isInitializing = false;
            initTimeoutId = setTimeout(initPanzoom, 1200);
          } else {
            showError('نقشه بارگذاری نشد. لطفاً دوباره تلاش کنید.');
            isInitializing = false;
          }
          return;
        }

        loadAttempts = 0;
        hideError();

        coverScale = calcCoverScale();
        if (coverScale < 0.1) coverScale = 1;

        img.style.transform = 'none';

        try {
          panzoom = Panzoom(img, {
            startScale: coverScale,
            minScale: coverScale * 0.5,
            maxScale: Math.max(coverScale * 5, 12),
            contain: 'outside',
            cursor: 'grab',
            touchAction: 'none',
            animate: true,
            duration: 150,
            wheel: true
          });

          window.panzoom = panzoom;

          // ===== رویدادهای صحیح برای @panzoom/panzoom =====
          // رویدادها روی خود المان شلیک می‌شن (نه روی instance)
          const setZooming = () => { isUserZooming = true; };
          const clearZooming = () => { isUserZooming = false; };

          img.addEventListener('panzoomstart', setZooming);
          img.addEventListener('panzoomzoom', setZooming);
          img.addEventListener('panzoomend', clearZooming);

          // پشتیبان برای موبایل
          container.addEventListener('pointerdown', setZooming, { passive: true });
          container.addEventListener('pointerup', clearZooming, { passive: true });
          container.addEventListener('pointercancel', clearZooming, { passive: true });
          container.addEventListener('touchend', clearZooming, { passive: true });
          container.addEventListener('touchcancel', clearZooming, { passive: true });

          // جلوگیری از اسکرول صفحه
          container.addEventListener('touchmove', function(e) {
            if (container.contains(e.target)) {
              e.preventDefault();
            }
          }, { passive: false });

          console.log('✅ Panzoom فعال شد، مقیاس اولیه:', coverScale.toFixed(3));
        } catch (e) {
          console.error('❌ خطا در راه‌اندازی panzoom:', e);
          showError('خطا در راه‌اندازی نقشه: ' + e.message);
          panzoom = null;
        } finally {
          isInitializing = false;
        }
      }

      // ---------- ۶. مدیریت Resize ----------
      function handleResize() {
        if (!panzoom || isUserZooming) return;

        const newCover = calcCoverScale();
        if (Math.abs(newCover - coverScale) < 0.015) return;

        const currentScale = panzoom.getScale();
        const userZoomRatio = currentScale / coverScale;

        coverScale = newCover;
        let newScale = userZoomRatio * coverScale;

        const minScale = coverScale * 0.5;
        const maxScale = Math.max(coverScale * 5, 12);
        newScale = Math.min(Math.max(newScale, minScale), maxScale);

        panzoom.zoomTo(newScale, {
          animate: true,
          duration: 200,
          focal: {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
          }
        });
      }

      function throttledResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleResize, 280);
      }

      window.addEventListener('resize', throttledResize);
      document.addEventListener('fullscreenchange', throttledResize);
      document.addEventListener('webkitfullscreenchange', throttledResize);

      // ---------- ۷. بارگذاری تصویر ----------
      img.addEventListener('load', function() {
        loadAttempts = 0;
        if (initTimeoutId) {
          clearTimeout(initTimeoutId);
          initTimeoutId = null;
        }
        if (!isInitializing) {
          initPanzoom();
        }
      });

      img.addEventListener('error', function() {
        showError('نقشه پیدا نشد. لطفاً اتصال اینترنت را بررسی کنید.');
      });

      if (img.complete && img.naturalWidth > 0) {
        loadAttempts = 0;
        initPanzoom();
      } else if (img.complete && !img.naturalWidth) {
        showError('نقشه قابل بارگذاری نیست.');
      }

      // Fallback
      initTimeoutId = setTimeout(function() {
        if (!panzoom && errorDiv.style.display !== 'block' && img.complete && img.naturalWidth > 0) {
          initPanzoom();
        }
      }, 3500);

      // ---------- ۸. دکمه تلاش مجدد ----------
      retryBtn.addEventListener('click', function() {
        if (isInitializing) return;

        loadAttempts = 0;
        hideError();

        if (initTimeoutId) {
          clearTimeout(initTimeoutId);
          initTimeoutId = null;
        }

        const baseSrc = img.src.split('?')[0];
        img.src = addQueryParam(baseSrc, 't', Date.now());
      });

      console.log('🚀 اپلیکیشن نقشه آماده است');
    })();
  </script>
</body>
</html>

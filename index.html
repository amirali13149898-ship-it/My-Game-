<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نقشه سرزمین</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }

    .map-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .map-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* نقاط کلیک‌پذیر (شهرها) */
    .city {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.25);
      border: 2px solid rgba(255, 215, 0, 0.7);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 10;
    }

    .city:hover, .city:active {
      background: rgba(255, 215, 0, 0.5);
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    /* موقعیت دقیق شهرها (بر اساس تصویر شما) */
    .city-center {
      width: 14%;
      height: 14%;
      top: 43%;
      left: 43%;
    }

    .city-north {
      width: 9%;
      height: 9%;
      top: 11%;
      left: 45.5%;
    }

    .city-south {
      width: 9%;
      height: 9%;
      top: 80%;
      left: 45.5%;
    }

    .city-west {
      width: 9%;
      height: 9%;
      top: 45.5%;
      left: 7%;
    }

    .city-east {
      width: 9%;
      height: 9%;
      top: 45.5%;
      left: 84%;
    }

    /* پنل اطلاعات شهر */
    .city-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.35s ease;
      z-index: 100;
      max-height: 60vh;
      overflow-y: auto;
    }

    .city-panel.active {
      transform: translateY(0);
    }

    .city-panel h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffd700;
    }

    .city-panel p {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .enter-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #1a1a1a;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="map-container">
    <!-- تصویر نقشه رو اینجا بذار -->
    <img src="map.jpg" alt="نقشه" class="map-img" id="mapImage">

    <!-- ۵ شهر کلیک‌پذیر -->
    <div class="city city-center" onclick="openCity('مرکزی', 'پایتخت بزرگ سرزمین. اینجا مرکز قدرت و تجارت است.')">🏰</div>
    <div class="city city-north" onclick="openCity('شمالی', 'شهری کوهستانی با آب و هوای سرد و معادن غنی.')">⛰️</div>
    <div class="city city-south" onclick="openCity('جنوبی', 'شهری سرسبز و پر از مزارع حاصلخیز.')">🌿</div>
    <div class="city city-west" onclick="openCity('غربی', 'بندر تجاری مهم در غرب سرزمین.')">⚓</div>
    <div class="city city-east" onclick="openCity('شرقی', 'شهری اسرارآمیز با برج‌های بلند و کتابخانه‌های قدیمی.')">📜</div>
  </div>

  <!-- پنل اطلاعات شهر -->
  <div class="city-panel" id="cityPanel">
    <button class="close-btn" onclick="closeCity()">×</button>
    <h2 id="cityName">نام شهر</h2>
    <p id="cityDesc">توضیحات شهر...</p>
    <button class="enter-btn" onclick="enterCity()">ورود به شهر</button>
  </div>

  <script>
    // راه‌اندازی تلگرام وب‌اپ
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // تمام صفحه بشه
    tg.setHeaderColor('#0f0f0f');
    tg.setBackgroundColor('#0f0f0f');

    let currentCity = '';

    function openCity(name, desc) {
      currentCity = name;
      document.getElementById('cityName').textContent = 'شهر ' + name;
      document.getElementById('cityDesc').textContent = desc;
      document.getElementById('cityPanel').classList.add('active');

      // ویبره ملایم (اختیاری)
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function closeCity() {
      document.getElementById('cityPanel').classList.remove('active');
    }

    function enterCity() {
      // اینجا می‌تونی بری به صفحه جداگانه یا محتوا رو عوض کنی
      tg.showAlert('وارد شهر ' + currentCity + ' شدی!\n\n(اینجا می‌تونی صفحه کامل شهر رو لود کنی)');
      
      // مثال: ارسال داده به ربات
      // tg.sendData(JSON.stringify({ action: 'enter_city', city: currentCity }));
    }

    // بستن پنل با کلیک بیرون
    document.querySelector('.map-container').addEventListener('click', function(e) {
      if (!e.target.classList.contains('city')) {
        closeCity();
      }
    });
  </script>
</body>
</html>

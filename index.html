<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>آردیان | ورود به بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== بقیه استایل‌های قبلی تو کدت (صفحه نام، نژاد، جادو) رو اینجا نگه داشتم ===== */
    /* ... (تمام CSS قبلی از #nameScreen تا #mapScreen رو کپی کن) ... */

    /* ===== صفحه پادشاهی (نژاد جدید) ===== */
    #kingdomScreen {
      background: #000;
    }
    .kingdom-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .kingdom-title {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Lalezar', Vazirmatn, serif;
      font-size: 42px;
      color: #ffd700;
      text-shadow: 0 0 20px #ffaa00;
      text-align: center;
      z-index: 30;
      background: linear-gradient(#fff, #c9a227);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .kingdom-desc {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      color: #d4af37;
      text-align: center;
      max-width: 320px;
      line-height: 1.8;
      z-index: 30;
      padding: 0 20px;
    }

    #kingdom-map-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #222;
      touch-action: none;
    }
    #kingdom-map {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .city-hit {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      z-index: 11;
      cursor: pointer;
      background: transparent;
      border-radius: 50%;
    }
    .city-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      background: #e63946;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 2.5px solid #fff;
      border-radius: 3px;
      box-shadow: 0 0 14px rgba(230, 57, 70, 0.75);
      pointer-events: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .city-hit:active .city-icon {
      transform: translate(-50%, -50%) rotate(45deg) scale(0.88);
      box-shadow: 0 0 8px rgba(230, 57, 70, 0.9);
    }
    .city-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 7px; height: 7px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    /* دکمه‌های بازگشت (همون بقیه کدت) */
    .back-btn,
    .map-back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #d4af37;
      border-radius: 30px;
      color: #ffe08a;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }
  </style>
</head>
<body>

  <!-- همه صفحه‌های قبلی رو (nameScreen تا mapScreen) همون‌طور که داری نگه دار ... -->

  <!-- ==================== صفحه پادشاهی (نژاد جدید) ==================== -->
  <div class="screen" id="kingdomScreen">
    <div class="kingdom-container" id="kingdomContainer">

      <!-- دکمه بازگشت به جادو -->
      <button class="back-btn" id="backToMagicBtn">بازگشت</button>

      <!-- عنوان و توصیف پادشاهی -->
      <div id="kingdom-info">
        <h2 id="kingdom-title" class="kingdom-title"></h2>
        <p id="kingdom-desc" class="kingdom-desc"></p>
      </div>

      <!-- نقشه -->
      <div id="kingdom-map-container">
        <button class="map-back-btn" id="kingdomBackBtn">بازگشت به انتخاب جادو</button>

        <img id="kingdom-map" src="https://i.ibb.co/Y4NtgbRZ/map.jpg" alt="نقشه پادشاهی">

        <!-- شهرها (همه نژادها دقیقاً ۵ شهر دارن) -->
        <div class="city-hit" style="left: 50%; top: 45%;" data-city="1">
          <div class="city-icon"></div>
        </div>
        <div class="city-hit" style="left: 50%; top: 11%;" data-city="2">
          <div class="city-icon"></div>
        </div>
        <div class="city-hit" style="left: 50%; top: 85%;" data-city="3">
          <div class="city-icon"></div>
        </div>
        <div class="city-hit" style="left: 12.5%; top: 47%;" data-city="4">
          <div class="city-icon"></div>
        </div>
        <div class="city-hit" style="left: 87.3%; top: 47%;" data-city="5">
          <div class="city-icon"></div>
        </div>
      </div>

      <div id="kingdom-error-msg" class="error-msg">
        <span id="kingdom-error-text">خطا در بارگذاری نقشه</span>
        <br><button id="kingdom-retry-btn">تلاش مجدد</button>
      </div>
    </div>
  </div>

  <!-- توست (همون قبلی) -->
  <div id="toast" class="toast" role="status"></div>

  <script>
    // ========== همه متغیرهای قبلی رو اینجا نگه دار (playerName، selectedRace، etc) ==========
    // ... (تمام کد قبلی از // ========== متغیرهای عمومی ========== تا آخر جادو رو کپی کن) ...

    // ========== صفحه پادشاهی (نژاد جدید) ==========
    let kingdomPanzoom = null;
    let kingdomMapImg = document.getElementById('kingdom-map');
    let kingdomMapContainer = document.getElementById('kingdom-map-container');
    let kingdomErrorDiv = document.getElementById('kingdom-error-msg');
    let kingdomRetryBtn = document.getElementById('kingdom-retry-btn');
    let kingdomCityHits = document.querySelectorAll('.city-hit');

    // تابع destroy کامل (دقیقاً مثل کدهای اوکی شده)
    function destroyKingdomPanzoom() {
      if (kingdomPanzoom) {
        try { kingdomPanzoom.destroy(); } catch (e) {}
        kingdomPanzoom = null;
      }
      isUserZooming = false;
      needsResizeAfterZoom = false;
      clearingZoom = false;
      activePointers = 0;

      try {
        kingdomMapContainer.removeEventListener('panzoomstart', setZooming);
        kingdomMapContainer.removeEventListener('panzoomzoom', setZooming);
        kingdomMapContainer.removeEventListener('panzoomend', onPanzoomEnd);
        kingdomMapContainer.removeEventListener('pointerdown', onPointerDown);
        kingdomMapContainer.removeEventListener('pointerup', onPointerUp);
        kingdomMapContainer.removeEventListener('pointercancel', onPointerUp);
        kingdomMapContainer.removeEventListener('touchend', onPointerUp);
        kingdomMapContainer.removeEventListener('touchcancel', onPointerUp);
        kingdomMapContainer.removeEventListener('touchmove', preventDefaultIfNeeded);

        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);
        window.removeEventListener('touchend', onPointerUp);
        window.removeEventListener('touchcancel', onPointerUp);
      } catch (e) {}
    }

    // بقیه تابع‌ها (showError، hideError، calcCoverScale، centerMap، initPanzoom، handleResize و ...) دقیقاً مثل کدهای اوکی شده که فرستادی (من توی کامنت گذاشتم)

    // ==================== رویدادهای صفحه پادشاهی ====================
    document.getElementById('backToMagicBtn').addEventListener('click', () => {
      goToScreen(magicScreen);
      showToast('به صفحه انتخاب جادو برگشتی', 2000);
    });

    kingdomRetryBtn.addEventListener('click', () => {
      if (isInitializing) return;
      kingdomMapImg.src = kingdomMapImg.src + '?t=' + Date.now();
    });

    // کلیک روی شهرها
    kingdomCityHits.forEach(hit => {
      hit.addEventListener('click', e => {
        e.stopPropagation();
        const cityId = hit.getAttribute('data-city');
        showToast(`وارد شهر شماره ${cityId} در پادشاهی شدی!`);
      });
    });

    // دکمه بازگشت از نقشه
    document.getElementById('kingdomBackBtn').addEventListener('click', () => {
      destroyKingdomPanzoom();
      goToScreen(magicScreen);
      showToast('به صفحه جادو برگشتی', 2000);
    });

    // ========== راه‌اندازی اولیه نقشه وقتی صفحه پادشاهی باز می‌شه (اختیاری) ==========
    // می‌تونی این کد رو داخل magicConfirmBtn یا جایی که می‌خوای بری به پادشاهی اضافه کنی:
    // setTimeout(() => {
    //   if (selectedRace && selectedRace !== 'انسان') {
    //     goToScreen(kingdomScreen);
    //     // تنظیم عنوان و توصیف (مثال)
    //     document.getElementById('kingdom-title').textContent = getKingdomTitle(selectedRace);
    //     document.getElementById('kingdom-desc').textContent = getKingdomDesc(selectedRace);
    //     initKingdomPanzoom();
    //   }
    // }, 800);

    // (اگر بخوای کل تابع initKingdomPanzoom رو هم برات بفرستم، بگو)
  </script>
</body>
</html>

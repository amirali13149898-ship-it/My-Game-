<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eldoria Map Prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#101218; font-family:Tahoma, Arial, sans-serif; color:white; }
  canvas#game { position:fixed; inset:0; width:100vw; height:100vh; display:block; background:radial-gradient(circle at center, #252938 0%, #101218 70%); }

  #hud {
    position:fixed; top:12px; right:12px; width:min(340px, calc(100vw - 24px));
    padding:12px 14px; border-radius:16px; background:rgba(0,0,0,0.48);
    backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.12);
    font-size:13px; line-height:1.9; z-index:10;
  }
  #hud strong { color:#ffd36a; }
  #hint { margin-top:6px; color:rgba(255,255,255,0.65); font-size:11.5px; }

  #minimapWrap {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(0,0,0,0.48); border:1px solid rgba(255,255,255,0.12);
    border-radius:14px; padding:6px; backdrop-filter:blur(8px);
  }
  #minimap { display:block; width:150px; height:140px; border-radius:10px; }
  #minimapTitle { font-size:11px; text-align:center; color:rgba(255,255,255,0.7); margin-bottom:4px; }

  #joystick {
    position:fixed; left:22px; bottom:22px; width:138px; height:138px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(8px); z-index:20; touch-action:none;
  }
  #knob {
    position:absolute; left:50%; top:50%; width:62px; height:62px; transform:translate(-50%,-50%);
    border-radius:50%; background:rgba(255,255,255,0.75); box-shadow:0 8px 22px rgba(0,0,0,0.35);
  }

  #buttons { position:fixed; right:12px; bottom:14px; display:flex; gap:8px; z-index:20; flex-wrap:wrap; justify-content:flex-end; max-width:220px; }
  button { border:0; border-radius:14px; padding:10px 12px; color:white; background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.15); backdrop-filter:blur(8px); font-family:inherit; font-size:12.5px; }
  button:active { transform:scale(0.96); }

  #toasts { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:30; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
  .toast { background:rgba(0,0,0,0.7); border:1px solid rgba(255,211,106,0.4); color:#ffd36a; padding:8px 16px;
    border-radius:999px; font-size:13px; opacity:0; transform:translateY(-10px); transition:all .35s ease; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateY(0); }

  #settingsPanel {
    position:fixed; right:12px; bottom:80px; z-index:25; background:rgba(0,0,0,0.72);
    border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:12px 14px;
    font-size:12.5px; display:none; min-width:180px; backdrop-filter:blur(10px);
  }
  #settingsPanel.open { display:block; }
  #settingsPanel label { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0; }

  #fps { position:fixed; left:12px; bottom:12px; z-index:10; font-size:11px; color:rgba(255,255,255,0.5); display:none; }
  #compass { position:fixed; top:170px; left:12px; z-index:10; font-size:20px; background:rgba(0,0,0,0.4);
    border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="minimapWrap">
  <div id="minimapTitle">نقشه جهان</div>
  <canvas id="minimap"></canvas>
</div>

<div id="compass">🧭</div>

<div id="hud">
  <div>منطقه فعلی: <strong id="regionName">---</strong></div>
  <div>نزدیک‌ترین شهر: <strong id="nearName">---</strong></div>
  <div>مختصات: <strong id="coords">0, 0</strong></div>
  <div id="hint">جوی‌استیک برای حرکت / WASD یا کلید جهت برای دسکتاپ</div>
</div>

<div id="toasts"></div>

<div id="joystick"><div id="knob"></div></div>

<div id="buttons">
  <button id="zoomIn">زوم +</button>
  <button id="zoomOut">زوم -</button>
  <button id="reset">اسپان</button>
  <button id="settingsBtn">⚙️ تنظیمات</button>
</div>

<div id="settingsPanel">
  <label><span>نمایش گرید</span><input type="checkbox" id="chkGrid" /></label>
  <label><span>مینی‌مپ</span><input type="checkbox" id="chkMinimap" checked /></label>
  <label><span>ردپا</span><input type="checkbox" id="chkTrail" checked /></label>
  <label><span>صدا</span><input type="checkbox" id="chkSound" checked /></label>
  <label><span>نمایش FPS</span><input type="checkbox" id="chkFps" /></label>
</div>

<div id="fps">FPS: 0</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

/* ------------------------------------------------------------------ */
/* تنظیمات کلی                                                        */
/* ------------------------------------------------------------------ */

const settings = { showGrid:false, showMinimap:true, showTrail:true, sound:true, showFps:false };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

const regionNameEl = document.getElementById('regionName');
const nearNameEl = document.getElementById('nearName');
const coordsEl = document.getElementById('coords');
const fpsEl = document.getElementById('fps');
const compassEl = document.getElementById('compass');
const toastsEl = document.getElementById('toasts');

let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const mmW = 150, mmH = 140;
  mmCanvas.width = mmW*DPR; mmCanvas.height = mmH*DPR;
  mmCanvas.style.width = mmW+'px'; mmCanvas.style.height = mmH+'px';
  mmCtx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ */
/* صدا                                                                 */
/* ------------------------------------------------------------------ */

let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
}
function playBeep(freq=520, dur=0.14, vol=0.05){
  if (!settings.sound || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq; osc.type='sine';
  gain.gain.value = vol;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
  osc.stop(audioCtx.currentTime+dur);
}
window.addEventListener('pointerdown', ensureAudio, { once:true });
window.addEventListener('keydown', ensureAudio, { once:true });

/* ------------------------------------------------------------------ */
/* Toast                                                               */
/* ------------------------------------------------------------------ */

function showToast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  toastsEl.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 400); }, 2400);
}

/* ------------------------------------------------------------------ */
/* هندسه هگز                                                          */
/* ------------------------------------------------------------------ */

const HEX_R = 430;
const SQRT3 = Math.sqrt(3);

function axialToWorld(q,r){
  return { x: HEX_R*1.5*q, y: HEX_R*SQRT3*(r+q/2) };
}
function hexPoints(cx,cy,radius){
  const pts=[];
  for(let i=0;i<6;i++){
    const a = Math.PI/180*(60*i);
    pts.push({ x: cx+radius*Math.cos(a), y: cy+radius*Math.sin(a) });
  }
  return pts;
}
function pointInPolygon(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    const inter = ((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/((yj-yi)||0.00001)+xi);
    if (inter) inside=!inside;
  }
  return inside;
}

/* ------------------------------------------------------------------ */
/* داده مناطق                                                         */
/* ------------------------------------------------------------------ */

const regionData = [
  { id:'angels', fa:'منطقه فرشته‌ها', en:'Celestia', q:0, r:-1, color:'#eef6ff', border:'#8fd3ff', text:'#26384f', texture:'holy',
    capital:'سنکتوری نور',
    points:[['قلعه طلوع','S'],['کریستال‌هال','SE'],['دروازه اثیری','SW'],['چشمه تطهیر','C'],['محراب ابدیت','N'],['دشت‌های الیزیوم','NE']] },
  { id:'ajins', fa:'منطقه اجین‌ها', en:'Zephyria', q:-1, r:0, color:'#dcf1ff', border:'#74c6e8', text:'#183347', texture:'wind',
    capital:'وینددور',
    points:[['خندق طوفان','SE'],['ابرشهر','E'],['صخره حرارتی','S'],['بادبان‌شهر','C'],['تندباد','W'],['چهارراه هوا','N']] },
  { id:'dwarves', fa:'منطقه دورف‌ها', en:'Khazardun', q:1, r:-1, color:'#ded7c8', border:'#a88b56', text:'#3c2e1b', texture:'mountain',
    capital:'آهن‌دژ',
    points:[['سنگ‌سپیر','W'],['دروازه پولادین','S'],['قله‌نور','N'],['بخاردره','SW'],['معدن‌ژرف','E'],['چکش‌هال','C']] },
  { id:'demons', fa:'منطقه شیاطین', en:'Demon Wastes', q:0, r:0, color:'#3b1d26', border:'#ff4b62', text:'#ffd6d6', texture:'fire',
    capital:'قلب فساد',
    points:[['دروازه خون','N'],['باتلاق سیاه','NE'],['دشت نفرین','SE'],['چاه تباهی','S'],['ویرانه خاکستر','SW'],['برج سایه','NW']] },
  { id:'dragons', fa:'منطقه نیمه‌دراگون‌ها', en:'Drakfort', q:-1, r:1, color:'#4e2718', border:'#ff7a45', text:'#ffe0c7', texture:'volcanic',
    capital:'دژ اژدها',
    points:[['گورستان‌خاکستر','NE'],['دندانه‌سوزان','E'],['منقارطوفان','N'],['خلیج‌جوشان','C'],['آشیانه‌وحشت','W'],['حلقه‌آتش','S']] },
  { id:'humans', fa:'منطقه انسان‌ها', en:'Valoria', q:1, r:0, color:'#dcefc4', border:'#77b255', text:'#253b20', texture:'plains',
    capital:'شهر والور',
    points:[['دژ طلایه‌دار','NW'],['دروازه‌تجارت','N'],['لبه‌سبز','SW'],['بندرگاه‌امید','C'],['دشت‌طلایی','E'],['تقاطع‌شاهان','S']] },
  { id:'elves', fa:'منطقه الف‌ها', en:'Sylvanor', q:0, r:1, color:'#c2eec2', border:'#43b56b', text:'#14361d', texture:'forest',
    capital:'ایلیلاندر',
    points:[['تورن‌فال','N'],['آرلیندا','E'],['دراکسیل','W'],['نیلوفریا','NE'],['وایلدهارت','S'],['وودن‌هال','C']] }
];

const links = [
  ['demons','angels'],['demons','ajins'],['demons','dwarves'],['demons','dragons'],['demons','humans'],['demons','elves'],
  ['humans','dwarves'],['humans','elves'],['dragons','ajins'],['dragons','elves'],['angels','ajins'],['angels','dwarves']
];

const regions = regionData.map(r=>{
  const p = axialToWorld(r.q, r.r);
  return { ...r, x:p.x, y:p.y, polygon: hexPoints(p.x,p.y,HEX_R) };
});

function dirOffset(dir){
  const k = HEX_R*0.58;
  const map = {
    C:[0,0], N:[0,-k], S:[0,k], E:[k,0], W:[-k,0],
    NE:[k*0.55,-k*0.72], NW:[-k*0.55,-k*0.72], SE:[k*0.55,k*0.72], SW:[-k*0.55,k*0.72]
  };
  return map[dir]||[0,0];
}

const settlements = [];
for (const reg of regions){
  settlements.push({ name:reg.capital, type:'capital', regionId:reg.id, x:reg.x, y:reg.y });
  for (const [name,dir] of reg.points){
    const [ox,oy] = dirOffset(dir);
    settlements.push({ name, type:'city', regionId:reg.id, x:reg.x+ox, y:reg.y+oy });
  }
}

/* بافت تصویری (نقاط تزئینی داخل هر هگز) */

const ICON_SPACING = 95;

for (const reg of regions){
  reg.textureDots = [];
  const xs = reg.polygon.map(p=>p.x), ys = reg.polygon.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  for (let x=minX; x<maxX; x+=ICON_SPACING){
    for (let y=minY; y<maxY; y+=ICON_SPACING){
      const jx = x + (Math.random()-0.5)*ICON_SPACING*0.5;
      const jy = y + (Math.random()-0.5)*ICON_SPACING*0.5;
      if (pointInPolygon(jx,jy,reg.polygon)){
        reg.textureDots.push({ x:jx, y:jy, s: 10+Math.random()*8 });
      }
    }
  }
}

/* ------------------------------------------------------------------ */
/* بازیکن                                                             */
/* ------------------------------------------------------------------ */

const humansRegion = regions.find(r=>r.id==='humans');
const spawn = { x:humansRegion.x, y:humansRegion.y };

const player = { x:spawn.x, y:spawn.y, radius:16, speed:210, moving:false, animPhase:0, facing:{x:0,y:1} };

/* بارگذاری موقعیت ذخیره‌شده */
try {
  const saved = JSON.parse(localStorage.getItem('eldoria_pos'));
  if (saved && typeof saved.x==='number' && typeof saved.y==='number' && getRegionAt(saved.x,saved.y)) {
    player.x = saved.x; player.y = saved.y;
  }
} catch(e){}

function getRegionAt(x,y){
  for (const reg of regions){ if (pointInPolygon(x,y,reg.polygon)) return reg; }
  return null;
}

setInterval(()=>{
  try { localStorage.setItem('eldoria_pos', JSON.stringify({x:player.x, y:player.y})); } catch(e){}
}, 1500);

const camera = { x:player.x, y:player.y, zoom:0.72 };
let currentRegionId = getRegionAt(player.x, player.y)?.id || null;

const playerTrail = [];

/* ------------------------------------------------------------------ */
/* ورودی‌ها                                                            */
/* ------------------------------------------------------------------ */

const input = { joyX:0, joyY:0, keyX:0, keyY:0 };
const keys = new Set();

window.addEventListener('keydown', e=>{ keys.add(e.key.toLowerCase()); updateKeyboard(); });
window.addEventListener('keyup', e=>{ keys.delete(e.key.toLowerCase()); updateKeyboard(); });

function updateKeyboard(){
  let x=0,y=0;
  if (keys.has('arrowleft')||keys.has('a')) x-=1;
  if (keys.has('arrowright')||keys.has('d')) x+=1;
  if (keys.has('arrowup')||keys.has('w')) y-=1;
  if (keys.has('arrowdown')||keys.has('s')) y+=1;
  const len=Math.hypot(x,y);
  if (len>0){ x/=len; y/=len; }
  input.keyX=x; input.keyY=y;
}

const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
let joyActive=false, joyPointerId=null;

joystick.addEventListener('pointerdown', e=>{
  joyActive=true; joyPointerId=e.pointerId; joystick.setPointerCapture(e.pointerId); updateJoystick(e);
});
joystick.addEventListener('pointermove', e=>{ if(joyActive && e.pointerId===joyPointerId) updateJoystick(e); });
joystick.addEventListener('pointerup', endJoystick);
joystick.addEventListener('pointercancel', endJoystick);

function updateJoystick(e){
  const rect = joystick.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const max=rect.width*0.34, len=Math.hypot(dx,dy);
  if (len>max){ dx=dx/len*max; dy=dy/len*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  input.joyX=dx/max; input.joyY=dy/max;
}
function endJoystick(e){
  if (e.pointerId!==joyPointerId) return;
  joyActive=false; joyPointerId=null; input.joyX=0; input.joyY=0;
  knob.style.transform='translate(-50%,-50%)';
}

document.getElementById('reset').onclick = ()=>{ player.x=spawn.x; player.y=spawn.y; };
document.getElementById('zoomIn').onclick = ()=>{ camera.zoom=Math.min(1.5, camera.zoom+0.12); };
document.getElementById('zoomOut').onclick = ()=>{ camera.zoom=Math.max(0.35, camera.zoom-0.12); };

const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
settingsBtn.onclick = ()=> settingsPanel.classList.toggle('open');

document.getElementById('chkGrid').onchange = e=> settings.showGrid = e.target.checked;
document.getElementById('chkMinimap').onchange = e=>{ settings.showMinimap = e.target.checked; document.getElementById('minimapWrap').style.display = e.target.checked?'block':'none'; };
document.getElementById('chkTrail').onchange = e=> settings.showTrail = e.target.checked;
document.getElementById('chkSound').onchange = e=> settings.sound = e.target.checked;
document.getElementById('chkFps').onchange = e=>{ settings.showFps = e.target.checked; fpsEl.style.display = e.target.checked?'block':'none'; };

/* ------------------------------------------------------------------ */
/* تبدیل مختصات                                                        */
/* ------------------------------------------------------------------ */

function worldToScreen(x,y){
  return { x:(x-camera.x)*camera.zoom + W/2, y:(y-camera.y)*camera.zoom + H/2 };
}

function canMoveTo(x,y){ return !!getRegionAt(x,y); }

function nearestSettlement(x,y){
  let best=null, bestDist=Infinity;
  for (const p of settlements){
    const d=Math.hypot(p.x-x,p.y-y);
    if (d<bestDist){ bestDist=d; best=p; }
  }
  return { point:best, distance:bestDist };
}

/* ------------------------------------------------------------------ */
/* رسم                                                                 */
/* ------------------------------------------------------------------ */

function drawPolygon(poly, fill, stroke, lineWidth=4){
  ctx.beginPath();
  const first = worldToScreen(poly[0].x, poly[0].y);
  ctx.moveTo(first.x, first.y);
  for (let i=1;i<poly.length;i++){ const p=worldToScreen(poly[i].x, poly[i].y); ctx.lineTo(p.x,p.y); }
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=stroke; ctx.lineWidth=lineWidth; ctx.stroke();
}

function drawText(text,x,y,size,color,weight='bold'){
  const s = worldToScreen(x,y);
  ctx.save();
  ctx.direction='rtl'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `${weight} ${size*camera.zoom}px Tahoma, Arial`;
  ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.strokeText(text,s.x,s.y);
  ctx.fillStyle=color; ctx.fillText(text,s.x,s.y);
  ctx.restore();
}

function drawCircle(x,y,r,fill,stroke='white',lineWidth=2){
  const s = worldToScreen(x,y);
  ctx.beginPath();
  ctx.arc(s.x,s.y, r*camera.zoom, 0, Math.PI*2);
  ctx.fillStyle=fill; ctx.fill();
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lineWidth; ctx.stroke(); }
}

function drawIcon(type, sx, sy, s){
  ctx.save();
  ctx.translate(sx, sy);
  switch(type){
    case 'holy':
      ctx.strokeStyle='rgba(255,225,140,0.9)'; ctx.lineWidth=Math.max(1,s*0.15);
      ctx.beginPath(); ctx.moveTo(-s,0); ctx.lineTo(s,0); ctx.moveTo(0,-s); ctx.lineTo(0,s); ctx.stroke();
      break;
    case 'wind':
      ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=Math.max(1,s*0.18);
      ctx.beginPath(); ctx.arc(0,0,s,Math.PI*0.15,Math.PI*1.1); ctx.stroke();
      break;
    case 'mountain':
      ctx.fillStyle='rgba(90,70,55,0.55)';
      ctx.beginPath(); ctx.moveTo(-s,s); ctx.lineTo(0,-s); ctx.lineTo(s,s); ctx.closePath(); ctx.fill();
      break;
    case 'fire':
      ctx.fillStyle='rgba(255,90,60,0.65)';
      ctx.beginPath(); ctx.arc(0,0,s*0.6,0,Math.PI*2); ctx.fill();
      break;
    case 'volcanic':
      ctx.strokeStyle='rgba(255,140,60,0.6)'; ctx.lineWidth=Math.max(1,s*0.16);
      ctx.beginPath(); ctx.moveTo(-s,-s*0.4); ctx.lineTo(-s*0.2,s*0.3); ctx.lineTo(s*0.1,-s*0.2); ctx.lineTo(s,s*0.5); ctx.stroke();
      break;
    case 'plains':
      ctx.strokeStyle='rgba(60,120,40,0.55)'; ctx.lineWidth=Math.max(1,s*0.14);
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*s*0.5,s*0.5); ctx.lineTo(i*s*0.3,-s*0.6); ctx.stroke(); }
      break;
    case 'forest':
      ctx.fillStyle='rgba(20,70,35,0.6)';
      ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(-s*0.7,s*0.3); ctx.lineTo(s*0.7,s*0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(70,45,25,0.6)'; ctx.fillRect(-s*0.08, s*0.25, s*0.16, s*0.35);
      break;
  }
  ctx.restore();
}

function drawRegions(){
  for (const reg of regions){
    const shifted = reg.polygon.map(p=>({x:p.x+10, y:p.y+18}));
    drawPolygon(shifted, 'rgba(0,0,0,0.22)', 'rgba(0,0,0,0)', 0);
  }
  for (const reg of regions){
    drawPolygon(reg.polygon, reg.color, reg.border, 5);

    if (camera.zoom > 0.42){
      for (const dot of reg.textureDots){
        const s = worldToScreen(dot.x, dot.y);
        if (s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) continue;
        drawIcon(reg.texture, s.x, s.y, dot.s*camera.zoom);
      }
    }

    drawText(reg.fa, reg.x, reg.y-54, 40, reg.text);
    drawText(reg.en, reg.x, reg.y+2, 22, reg.text, 'normal');
    drawText(reg.capital, reg.x, reg.y+46, 22, reg.text);
  }
}

function drawRoads(){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.lineWidth=3*camera.zoom;
  ctx.setLineDash([10*camera.zoom,8*camera.zoom]);
  ctx.lineDashOffset = -performance.now()/60;

  for (const reg of regions){
    const cap = worldToScreen(reg.x, reg.y);
    for (const [name,dir] of reg.points){
      const [ox,oy] = dirOffset(dir);
      const p = worldToScreen(reg.x+ox, reg.y+oy);
      ctx.beginPath(); ctx.moveTo(cap.x,cap.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    }
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle='rgba(255,211,106,0.65)';
  ctx.lineWidth=5*camera.zoom;
  ctx.setLineDash([]);
  for (const [a,b] of links){
    const ra = regions.find(r=>r.id===a), rb = regions.find(r=>r.id===b);
    const pa = worldToScreen(ra.x, ra.y), pb = worldToScreen(rb.x, rb.y);
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  }
  ctx.restore();
}

function drawSettlements(){
  for (const p of settlements){
    const s = worldToScreen(p.x, p.y);
    if (p.type==='capital'){
      ctx.strokeStyle='#3a2c12'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y-14*camera.zoom); ctx.lineTo(s.x, s.y-2*camera.zoom); ctx.stroke();
      ctx.fillStyle='#ffd36a';
      ctx.beginPath(); ctx.moveTo(s.x, s.y-14*camera.zoom); ctx.lineTo(s.x+10*camera.zoom, s.y-10*camera.zoom); ctx.lineTo(s.x, s.y-6*camera.zoom); ctx.closePath(); ctx.fill();
      drawCircle(p.x, p.y, 13, '#ffd36a', '#573b00', 3);
      drawText(p.name, p.x, p.y+26, 19, '#ffe9b0');
    } else {
      ctx.fillStyle='#8b3b2b';
      ctx.beginPath(); ctx.moveTo(s.x-9*camera.zoom, s.y-4*camera.zoom); ctx.lineTo(s.x, s.y-13*camera.zoom); ctx.lineTo(s.x+9*camera.zoom, s.y-4*camera.zoom); ctx.closePath(); ctx.fill();
      drawCircle(p.x, p.y, 7, 'rgba(255,255,255,0.95)', 'rgba(0,0,0,0.5)', 2);
      if (camera.zoom > 0.5) drawText(p.name, p.x, p.y+20, 15, 'rgba(255,255,255,0.9)', 'normal');
    }
  }
}

function drawTrail(){
  if (!settings.showTrail) return;
  const now = performance.now();
  for (let i=playerTrail.length-1;i>=0;i--){
    const t = playerTrail[i];
    const age = now - t.t;
    if (age > 650){ playerTrail.splice(i,1); continue; }
    const alpha = 1 - age/650;
    const s = worldToScreen(t.x, t.y);
    ctx.beginPath();
    ctx.arc(s.x, s.y, 5*camera.zoom*alpha, 0, Math.PI*2);
    ctx.fillStyle = `rgba(54,163,255,${alpha*0.35})`;
    ctx.fill();
  }
}

function drawPlayer(){
  const s = worldToScreen(player.x, player.y);
  ctx.save();

  ctx.beginPath();
  ctx.ellipse(s.x, s.y+14*camera.zoom, 18*camera.zoom, 8*camera.zoom, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fill();

  if (player.moving){
    const swing = Math.sin(player.animPhase)*8*camera.zoom;
    ctx.fillStyle='rgba(30,60,90,0.85)';
    ctx.beginPath(); ctx.ellipse(s.x-8*camera.zoom, s.y+16*camera.zoom+swing*0.3, 5*camera.zoom, 3*camera.zoom, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s.x+8*camera.zoom, s.y+16*camera.zoom-swing*0.3, 5*camera.zoom, 3*camera.zoom, 0,0,Math.PI*2); ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(s.x, s.y, player.radius*camera.zoom, 0, Math.PI*2);
  ctx.fillStyle='#36a3ff'; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='white'; ctx.stroke();

  const fx = s.x + player.facing.x*10*camera.zoom;
  const fy = s.y + player.facing.y*10*camera.zoom - 3*camera.zoom;
  ctx.beginPath(); ctx.arc(fx, fy, 4*camera.zoom, 0, Math.PI*2);
  ctx.fillStyle='white'; ctx.fill();

  ctx.restore();
}

function drawGrid(){
  if (!settings.showGrid) return;
  const step = 100;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  const startX = Math.floor((camera.x - W/2/camera.zoom)/step)*step;
  const endX = camera.x + W/2/camera.zoom;
  const startY = Math.floor((camera.y - H/2/camera.zoom)/step)*step;
  const endY = camera.y + H/2/camera.zoom;
  for (let x=startX; x<endX; x+=step){
    const a = worldToScreen(x, startY), b = worldToScreen(x, endY);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for (let y=startY; y<endY; y+=step){
    const a = worldToScreen(startX, y), b = worldToScreen(endX, y);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* مینی‌مپ                                                             */
/* ------------------------------------------------------------------ */

const mmBounds = (()=>{
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const reg of regions){
    for (const p of reg.polygon){
      minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
      minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
    }
  }
  return { minX,maxX,minY,maxY };
})();

function mmTransform(x,y){
  const mmW=150, mmH=140, pad=10;
  const scale = Math.min((mmW-pad*2)/(mmBounds.maxX-mmBounds.minX), (mmH-pad*2)/(mmBounds.maxY-mmBounds.minY));
  const offX = pad - mmBounds.minX*scale + (mmW-pad*2 - (mmBounds.maxX-mmBounds.minX)*scale)/2;
  const offY = pad - mmBounds.minY*scale + (mmH-pad*2 - (mmBounds.maxY-mmBounds.minY)*scale)/2;
  return { x:x*scale+offX, y:y*scale+offY, scale };
}

function drawMinimap(){
  if (!settings.showMinimap) return;
  mmCtx.clearRect(0,0,150,140);
  for (const reg of regions){
    mmCtx.beginPath();
    const first = mmTransform(reg.polygon[0].x, reg.polygon[0].y);
    mmCtx.moveTo(first.x, first.y);
    for (let i=1;i<reg.polygon.length;i++){
      const p = mmTransform(reg.polygon[i].x, reg.polygon[i].y);
      mmCtx.lineTo(p.x,p.y);
    }
    mmCtx.closePath();
    mmCtx.fillStyle = reg.color;
    mmCtx.globalAlpha = 0.85;
    mmCtx.fill();
    mmCtx.globalAlpha = 1;
    mmCtx.strokeStyle = reg.border;
    mmCtx.lineWidth = 1;
    mmCtx.stroke();
  }
  const pp = mmTransform(player.x, player.y);
  const pulse = 3 + Math.sin(performance.now()/200)*1.2;
  mmCtx.beginPath();
  mmCtx.arc(pp.x, pp.y, pulse+3, 0, Math.PI*2);
  mmCtx.fillStyle='rgba(54,163,255,0.35)';
  mmCtx.fill();
  mmCtx.beginPath();
  mmCtx.arc(pp.x, pp.y, 3.4, 0, Math.PI*2);
  mmCtx.fillStyle='#ffffff';
  mmCtx.fill();
}

/* ------------------------------------------------------------------ */
/* حلقه بازی                                                          */
/* ------------------------------------------------------------------ */

let last = performance.now();
let fpsSmooth = 60;

function update(dt){
  let ix = input.joyX || input.keyX;
  let iy = input.joyY || input.keyY;
  const len = Math.hypot(ix,iy);
  if (len>1){ ix/=len; iy/=len; }

  player.moving = len > 0.05;
  if (player.moving){
    player.animPhase += dt*10;
    player.facing = { x: ix, y: iy };
  }

  const reg = getRegionAt(player.x, player.y);
  let speed = player.speed;
  if (reg && reg.id==='demons') speed *= 0.82;

  const nx = player.x + ix*speed*dt;
  const ny = player.y + iy*speed*dt;

  if (canMoveTo(nx,ny)){ player.x=nx; player.y=ny; }
  else {
    if (canMoveTo(nx, player.y)) player.x = nx;
    if (canMoveTo(player.x, ny)) player.y = ny;
  }

  if (settings.showTrail && player.moving){
    const lastTrail = playerTrail[playerTrail.length-1];
    if (!lastTrail || Math.hypot(lastTrail.x-player.x, lastTrail.y-player.y) > 14){
      playerTrail.push({ x:player.x, y:player.y, t: performance.now() });
      if (playerTrail.length > 40) playerTrail.shift();
    }
  }

  camera.x += (player.x-camera.x)*0.1;
  camera.y += (player.y-camera.y)*0.1;

  const newReg = getRegionAt(player.x, player.y);
  if (newReg && newReg.id !== currentRegionId){
    currentRegionId = newReg.id;
    showToast(`وارد ${newReg.fa} شدید`);
    playBeep(newReg.id==='demons' ? 220 : 620, 0.18, 0.06);
  }

  const near = nearestSettlement(player.x, player.y);
  regionNameEl.textContent = newReg ? `${newReg.fa} / ${newReg.en}` : 'خارج از نقشه';
  nearNameEl.textContent = near.point ? `${near.point.name} - ${Math.round(near.distance)}px` : '---';
  coordsEl.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;

  const angle = Math.atan2(player.facing.y, player.facing.x) * 180/Math.PI;
  const dirs = ['➡️','↘️','⬇️','↙️','⬅️','↖️','⬆️','↗️'];
  const idx = Math.round(((angle+180)/45)) % 8;
  if (player.moving) compassEl.textContent = dirs[idx] || '🧭';
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  drawRegions();
  drawRoads();
  drawTrail();
  drawSettlements();
  drawPlayer();
  drawMinimap();
}

function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;

  const instFps = 1/Math.max(dt,0.0001);
  fpsSmooth += (instFps - fpsSmooth)*0.1;
  if (settings.showFps) fpsEl.textContent = 'FPS: ' + Math.round(fpsSmooth);

  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نقشه بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none; /* جلوگیری از اسکرول */
    }
    #map-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #map {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;  /* پر کردن صفحه با نقشه */
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 0 0;
    }
    #map:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <img id="map" src="https://i.ibb.co/Y4NtgbRZ/map.jpg" alt="نقشه بازی">
  </div>

  <script>
    (function() {
      // آماده‌سازی تلگرام
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.requestFullscreen();
      tg.disableVerticalSwipes();

      const img = document.getElementById('map');
      const container = document.getElementById('map-container');

      // تابع راه‌اندازی panzoom
      function initPanzoom() {
        // اگر تصویر هنوز بارگذاری کامل نشده، صبر کن
        if (!img.naturalWidth || !img.naturalHeight) {
          console.warn('تصویر آماده نیست، صبر می‌کنم...');
          return;
        }

        // پاک کردن transform قبلی
        img.style.transform = 'none';

        // ایجاد نمونه panzoom با تنظیمات لمسی
        const panzoom = Panzoom(img, {
          startScale: 1,          // با object-fit:cover صفحه پر شده، پس scale=1 کافیست
          minScale: 0.5,
          maxScale: 4,
          contain: 'inside',
          cursor: 'grab',
          touchAction: 'none',
          // غیرفعال کردن زوم با چرخ موس (پیش‌فرض خاموش است)
          // اما برای اطمینان، رویداد wheel را مسدود می‌کنیم
        });

        // جلوگیری از اسکرول با چرخ موس و لمس
        container.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        container.addEventListener('touchmove', (e) => {
          if (e.target === img) e.preventDefault();
        }, { passive: false });

        // ذخیره نمونه برای دسترسی احتمالی
        window.panzoomInstance = panzoom;

        console.log('✅ Panzoom فعال شد');
      }

      // بارگذاری تصویر
      if (img.complete && img.naturalWidth) {
        initPanzoom();
      } else {
        img.addEventListener('load', initPanzoom);
        img.addEventListener('error', () => console.error('❌ خطا در بارگذاری تصویر'));
      }

      // تلاش مجدد بعد از ۲ ثانیه (برای مواقعی که رویداد load اجرا نشد)
      setTimeout(() => {
        if (!window.panzoomInstance) {
          initPanzoom();
        }
      }, 2000);
    })();
  </script>
</body>
</html>

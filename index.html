<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>آردیان | ورود به بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fire-1: #ffe082; --fire-2: #ffab24; --fire-3: #ff6a00; --fire-4: #e03600;
      --ice-2: #4da6ff; --gold: #d4af37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
    }
    .screen {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease; z-index: 1;
    }
    .screen.active { opacity: 1; visibility: visible; z-index: 10; }

    /* ===== صفحه نام ===== */
    #nameScreen {
      display: grid; place-items: center; background: #020204;
      background-image:
        radial-gradient(80% 60% at 20% 20%, rgba(77,166,255,.18), transparent 55%),
        radial-gradient(80% 60% at 85% 80%, rgba(255,106,0,.22), transparent 55%);
      padding: 16px 18px;
    }
    .stage { position: relative; width: min(320px, 78vw); }
    .card {
      position: relative; z-index: 0; border-radius: 28px; padding: 7px;
      background:
        linear-gradient(90deg, rgba(96,180,255,.95), rgba(16,22,32,0) 44%),
        linear-gradient(270deg, rgba(255,138,32,.95), rgba(16,22,32,0) 44%),
        linear-gradient(180deg, #10131b, #05060a);
    }
    .card::before, .card::after {
      content: ""; position: absolute; inset: -3px; border-radius: 32px;
      pointer-events: none; z-index: -1;
    }
    .card::before {
      box-shadow: -18px 0 40px -6px rgba(70,165,255,.65), 0 -16px 32px -12px rgba(95,182,255,.45);
      animation: icePulse 5s ease-in-out infinite;
    }
    .card::after {
      box-shadow: 18px 0 40px -6px rgba(255,120,20,.65), 0 18px 34px -12px rgba(255,120,20,.50);
      animation: fireFlicker 3.4s ease-in-out infinite;
    }
    @keyframes icePulse { 0%,100%{opacity:.85} 50%{opacity:1} }
    @keyframes fireFlicker {
      0%,100%{opacity:.85} 12%{opacity:1} 27%{opacity:.76} 41%{opacity:.98} 60%{opacity:.82} 78%{opacity:1}
    }
    .card-inner {
      position: relative; border-radius: 22px;
      background: radial-gradient(120% 90% at 50% -10%, #10131b 0%, #06070b 45%, #030305 100%);
      box-shadow: inset 0 0 50px rgba(0,0,0,.85); padding: 22px 18px 20px; overflow: hidden;
    }
    .ornament { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .o-line { height: 1.5px; width: clamp(50px,18vw,90px); border-radius: 2px; }
    .line-right { background: linear-gradient(to right, rgba(216,224,238,.9), transparent); }
    .line-left { background: linear-gradient(to left, rgba(216,224,238,.9), transparent); }
    .o-star { width: 18px; height: 18px; flex: none; filter: drop-shadow(0 0 5px rgba(205,220,245,.55)); }
    .ornament.bottom { margin-top: 16px; }
    .title {
      margin: 14px 0 0; text-align: center; font-family: 'Lalezar', serif; font-weight: 400;
      font-size: clamp(26px,7vw,34px); line-height: 1.25;
      background: linear-gradient(180deg, #fff 5%, #e6ebf3 35%, #9aa3b4 52%, #6f7889 58%, #d7dde8 82%, #fff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle {
      margin: 4px 0 0; text-align: center; font-family: 'Lalezar', serif;
      font-size: clamp(16px,4.5vw,22px); display: flex; flex-wrap: wrap;
      justify-content: center; gap: 0 .3em;
    }
    .name {
      background: linear-gradient(180deg, var(--fire-1), var(--fire-2) 38%, var(--fire-3) 68%, var(--fire-4));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,110,0,.55));
    }
    .welcome {
      background: linear-gradient(180deg, #f6f8fc 10%, #c6cdda 48%, #8b93a4 60%, #e2e7f0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .input-box { margin-top: 18px; }
    .game-input {
      width: 100%; height: 44px; border-radius: 40px;
      border: 1.5px solid rgba(226,233,245,.75); outline: none;
      background: linear-gradient(180deg, #0a0c11, #04050a);
      box-shadow: 0 0 14px rgba(190,210,245,.25), inset 0 3px 12px rgba(0,0,0,.85);
      color: #eef2fa; font-family: 'Vazirmatn', sans-serif; font-size: 14px;
      padding: 0 18px; text-align: center; caret-color: #ffb347;
    }
    .game-input::placeholder { color: rgba(180,190,210,.55); }
    .game-input:focus {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(200,220,255,.4), inset 0 3px 12px rgba(0,0,0,.85);
    }
    .confirm-button {
      display: block; width: 100%; margin-top: 16px; border: 0; padding: 0;
      background: transparent; cursor: pointer; transition: transform .12s ease;
    }
    .confirm-button svg { display: block; width: 100%; height: auto; overflow: visible; }
    .confirm-button:active { transform: scale(.97); }
    .confirm-button.pulse svg { animation: btnPulse .55s ease; }
    @keyframes btnPulse {
      0% { filter: none; }
      35% { filter: brightness(1.5) drop-shadow(0 0 24px rgba(255,130,20,.9)); }
      100% { filter: none; }
    }
    .button-text {
      font-family: 'Vazirmatn', sans-serif; font-size: 28px; font-weight: 700;
      fill: #fff3c4; text-anchor: middle; dominant-baseline: middle;
    }
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .particle {
      position: absolute; border-radius: 50%; opacity: 0; animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: var(--o, .5); }
      100% { transform: translateY(var(--dy, -200px)); opacity: 0; }
    }
    .toast {
      position: fixed; right: 50%; bottom: 34px; transform: translate(50%, 20px);
      background: linear-gradient(180deg, #191c24, #0b0d12);
      border: 1px solid rgba(255,150,50,.55);
      box-shadow: 0 0 26px rgba(255,120,20,.35);
      color: #ffe9c9; font-size: 16px; padding: 14px 28px; border-radius: 16px;
      opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s;
      z-index: 50; max-width: 88vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(50%, 0); }

    /* ===== صفحه نژاد ===== */
    #raceScreen { background: #000; }
    .game-container {
      position: relative; width: 100%; height: 100%;
      background: radial-gradient(120% 80% at 50% 20%, #2a2418, #0a0806 70%);
      background-size: cover; background-position: center;
      transition: background 0.4s ease;
    }
    .race-panel {
      position: absolute; top: 12%; right: 3%; width: 32%; max-width: 230px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px;
      background: rgba(0,0,0,.75); border: 2.5px solid var(--gold); border-radius: 14px;
      box-shadow: 0 0 15px rgba(212,175,55,.6); z-index: 20;
    }
    .race-btn, .gender-btn, .magic-btn {
      background: linear-gradient(145deg, #f5f0e1, #e8dcc8);
      border: 1.8px solid #c9a227; border-radius: 8px; padding: 8px 4px;
      font-size: 13px; font-weight: bold; color: #2c1e0f; text-align: center;
      cursor: pointer; transition: all .2s; min-height: 42px;
      display: flex; align-items: center; justify-content: center;
    }
    .race-btn.selected, .gender-btn.selected, .magic-btn.selected {
      background: linear-gradient(145deg, #ffe08a, #f0c040);
      border-color: #ff9900; box-shadow: 0 0 12px #ffaa00; color: #1a0f00;
    }
    .gender-box {
      position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%);
      display: none; gap: 12px; z-index: 25;
    }
    .gender-btn { width: 110px; padding: 10px 0; font-size: 15px; border-radius: 10px; border-width: 2px; }
    .race-confirm-btn {
      position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
      width: 50%; max-width: 240px; padding: 11px 18px;
      background: linear-gradient(90deg, #8b4513, #d2691e, #8b4513);
      border: 2.5px solid #ffd700; border-radius: 40px; color: #fff8dc;
      font-size: 17px; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 18px rgba(255,180,0,.7); z-index: 30;
    }
    .race-confirm-btn:disabled { opacity: .45; cursor: not-allowed; }
    .player-name-badge {
      position: absolute; top: 10px; left: 12px;
      background: rgba(0,0,0,.7); border: 1.5px solid var(--gold); color: #ffe08a;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      z-index: 40; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== صفحه جادو ===== */
    #magicScreen { background: #000; }
    .magic-container {
      position: relative; width: 100%; height: 100%;
      background: radial-gradient(120% 80% at 50% 10%, #1a1428, #05040a 70%);
      background-size: cover; background-position: center; transition: background .4s ease;
    }
    .back-btn {
      position: absolute; top: 14px; left: 14px; z-index: 50;
      background: rgba(0,0,0,.7); border: 2px solid var(--gold); border-radius: 30px;
      color: #ffe08a; padding: 4px 12px; font-size: 13px; font-weight: bold; cursor: pointer;
      backdrop-filter: blur(4px); box-shadow: 0 0 12px rgba(212,175,55,.3);
    }
    .magic-list {
      position: absolute; top: 20%; right: 5%; width: 28%; max-width: 160px;
      display: flex; flex-direction: column; gap: 8px; z-index: 20;
    }
    .magic-btn { min-height: 38px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .magic-confirm-btn {
      position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
      width: 55%; max-width: 300px; border: 0; padding: 0; background: transparent;
      cursor: pointer; z-index: 30;
    }
    .magic-confirm-btn:disabled { opacity: .45; cursor: not-allowed; }
    .magic-confirm-btn svg { display: block; width: 100%; height: auto; }
    .magic-confirm-btn .button-text { font-size: 48px; }
    .magic-info {
      position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.7); border: 1px solid var(--gold); border-radius: 16px;
      padding: 8px 16px; color: #ffe08a; font-size: 14px; z-index: 25; text-align: center;
      white-space: nowrap;
    }

    /* ===== صفحه نقشه پادشاهی (بدون دکمه بازگشت) ===== */
    #kingdomScreen { background: #111; }
    #kingdom-map-container {
      width: 100%; height: 100%; overflow: hidden; touch-action: none;
      position: relative; background: #222;
    }
    #kingdom-map-wrapper {
      position: relative; display: block; transform-origin: 0 0; will-change: transform;
    }
    #kingdom-map {
      display: block; width: auto; height: auto; max-width: none;
      touch-action: none; user-select: none; -webkit-user-drag: none;
      pointer-events: none; vertical-align: top;
    }
    #kingdom-map.hidden { display: none; }
    .kingdom-title-badge {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 45; font-family: 'Lalezar', serif;
      font-size: clamp(18px, 5vw, 28px); color: #ffd700;
      text-shadow: 0 0 16px #ffaa00; pointer-events: none; text-align: center;
      max-width: 70%;
    }
    .city-hit {
      position: absolute; width: 44px; height: 44px;
      transform: translate(-50%, -50%); z-index: 11; cursor: pointer;
      background: transparent; border: 0; border-radius: 50%; padding: 0;
    }
    .city-icon {
      position: absolute; top: 50%; left: 50%; width: 26px; height: 26px;
      background: #e63946; transform: translate(-50%, -50%) rotate(45deg);
      border: 2.5px solid #fff; border-radius: 3px;
      box-shadow: 0 0 14px rgba(230,57,70,.75); pointer-events: none;
      transition: transform .15s, box-shadow .15s;
    }
    .city-hit:active .city-icon {
      transform: translate(-50%, -50%) rotate(45deg) scale(.88);
      box-shadow: 0 0 8px rgba(230,57,70,.9);
    }
    .city-icon::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 7px; height: 7px; background: #fff; border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
    }
    #kingdom-error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; background: rgba(0,0,0,.88); padding: 25px 30px; border-radius: 12px;
      text-align: center; display: none; z-index: 30; max-width: 85%; direction: rtl;
      border: 1px solid #555;
    }
    #kingdom-error button {
      margin-top: 15px; padding: 10px 28px; background: #4CAF50; border: none;
      color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- صفحه ۱: نام -->
  <div class="screen active" id="nameScreen">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f7fc"/><stop offset=".55" stop-color="#b9c2d4"/><stop offset="1" stop-color="#6d7688"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="stage">
      <div class="fx" id="fx"></div>
      <div class="card">
        <div class="card-inner">
          <div class="ornament">
            <span class="o-line line-right"></span>
            <svg class="o-star" viewBox="0 0 24 24"><path d="M12 0C12.9 7.2 15.6 10.3 24 12 15.6 13.7 12.9 16.8 12 24 11.1 16.8 8.4 13.7 0 12 8.4 10.3 11.1 7.2 12 0Z" fill="url(#starGrad)"/></svg>
            <span class="o-line line-left"></span>
          </div>
          <h1 class="title">درود به بازی</h1>
          <p class="subtitle"><span class="name">آردیان</span><span class="welcome">خوش آمدید.</span></p>
          <div class="input-box">
            <input id="gameInput" class="game-input" type="text" autocomplete="off" placeholder="لطفا نام خود را وارد کنید..." maxlength="20">
          </div>
          <button id="nameConfirmBtn" class="confirm-button" type="button">
            <svg viewBox="0 0 520 190">
              <defs>
                <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ff8a1e"/><stop offset="45%" stop-color="#a52d05"/><stop offset="100%" stop-color="#4c1004"/>
                </linearGradient>
                <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#fff078"/><stop offset="25%" stop-color="#ff9c19"/><stop offset="60%" stop-color="#ff4d00"/><stop offset="100%" stop-color="#ffd05a"/>
                </linearGradient>
              </defs>
              <path d="M55 25 L465 25 L485 45 L478 63 L490 95 L478 127 L485 145 L465 165 L55 165 L35 145 L42 127 L30 95 L42 63 L35 45 Z"
                fill="url(#panelGradient)" stroke="url(#borderGradient)" stroke-width="4"/>
              <text x="260" y="98" class="button-text">تأیید</text>
            </svg>
          </button>
          <div class="ornament bottom">
            <span class="o-line line-right"></span>
            <svg class="o-star" viewBox="0 0 24 24"><path d="M12 0C12.9 7.2 15.6 10.3 24 12 15.6 13.7 12.9 16.8 12 24 11.1 16.8 8.4 13.7 0 12 8.4 10.3 11.1 7.2 12 0Z" fill="url(#starGrad)"/></svg>
            <span class="o-line line-left"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- صفحه ۲: نژاد -->
  <div class="screen" id="raceScreen">
    <div class="game-container" id="gameContainer">
      <div class="player-name-badge" id="playerNameBadge">ماجراجو</div>
      <div class="race-panel">
        <button class="race-btn" data-race="انسان">انسان</button>
        <button class="race-btn" data-race="دروف">دروف</button>
        <button class="race-btn" data-race="نیمه انسان">نیمه انسان</button>
        <button class="race-btn" data-race="نیمه دارگون">نیمه دارگون</button>
        <button class="race-btn" data-race="الف">الف</button>
        <button class="race-btn" data-race="فرشته">فرشته</button>
      </div>
      <div class="gender-box" id="genderBox">
        <button class="gender-btn" data-gender="زن">زن</button>
        <button class="gender-btn" data-gender="مرد">مرد</button>
      </div>
      <button class="race-confirm-btn" id="raceConfirmBtn" disabled>تأیید و ادامه</button>
    </div>
  </div>

  <!-- صفحه ۳: جادو -->
  <div class="screen" id="magicScreen">
    <div class="magic-container" id="magicContainer">
      <button class="back-btn" id="backToRaceBtn">بازگشت</button>
      <div class="magic-list">
        <button class="magic-btn" data-magic="آتش">🔥 آتش</button>
        <button class="magic-btn" data-magic="آب">💧 آب</button>
        <button class="magic-btn" data-magic="باد">🌪️ باد</button>
        <button class="magic-btn" data-magic="خاک">🪨 خاک</button>
        <button class="magic-btn" data-magic="نور">☀️ نور</button>
        <button class="magic-btn" data-magic="تاریکی">🌑 تاریکی</button>
      </div>
      <div class="magic-info" id="magicInfo">جادوی مورد نظر خود را انتخاب کنید</div>
      <button class="magic-confirm-btn" id="magicConfirmBtn" type="button" disabled>
        <svg viewBox="0 0 520 190">
          <defs>
            <linearGradient id="magicPanelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff7213"/><stop offset="45%" stop-color="#a52d05"/><stop offset="100%" stop-color="#4c1004"/>
            </linearGradient>
            <linearGradient id="magicBorderGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff078"/><stop offset="25%" stop-color="#ff9c19"/><stop offset="60%" stop-color="#ff4d00"/><stop offset="100%" stop-color="#ffd05a"/>
            </linearGradient>
          </defs>
          <path class="main-panel"
            d="M55 25 L465 25 L485 45 L478 63 L490 95 L478 127 L485 145 L465 165 L55 165 L35 145 L42 127 L30 95 L42 63 L35 45 Z"
            fill="url(#magicPanelGrad)" stroke="url(#magicBorderGrad)" stroke-width="4"/>
          <text x="260" y="98" class="button-text">تأیید</text>
        </svg>
      </button>
    </div>
  </div>

  <!-- صفحه ۴: نقشه پادشاهی (بدون دکمه بازگشت) -->
  <div class="screen" id="kingdomScreen">
    <div id="kingdom-map-container">
      <!-- عنوان نقشه -->
      <div class="kingdom-title-badge" id="kingdomTitle"></div>
      <!-- تصویر نقشه و شهرها -->
      <div id="kingdom-map-wrapper">
        <img id="kingdom-map" src="" alt="نقشه پادشاهی">
        <!-- شهرها با JS پر می‌شوند -->
      </div>
      <!-- خطا -->
      <div id="kingdom-error">
        <span id="kingdom-error-text">خطا در بارگذاری نقشه</span>
        <br><button id="kingdom-retry-btn">تلاش مجدد</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    // ========== داده پادشاهی‌ها (نقشه + موقعیت شهرها) ==========
    const KINGDOMS = {
      "انسان": {
        title: "پادشاهی انسان‌ها",
        mapSrc: "https://i.ibb.co/Y4NtgbRZ/map.jpg",
        cities: [
          { id: "1", left: "50%", top: "45%" },
          { id: "2", left: "50%", top: "11%" },
          { id: "3", left: "50%", top: "85%" },
          { id: "4", left: "12.5%", top: "47%" },
          { id: "5", left: "87.3%", top: "47%" }
        ]
      },
      "دروف": {
        title: "پادشاهی دروف‌ها",
        mapSrc: "https://i.ibb.co/99JGPLqp/Duck-ai-image-2026-08-21-08-56.jpg",
        cities: [
          { id: "1", left: "50%", top: "41%" },
          { id: "2", left: "50.09%", top: "9%" },
          { id: "3", left: "50.3%", top: "80%" },
          { id: "4", left: "14.2%", top: "47.5%" },
          { id: "5", left: "83.25%", top: "46.1%" }
        ]
      },
      "نیمه انسان": {
        title: "پادشاهی نیمه انسان‌ها",
        mapSrc: "https://i.ibb.co/WW78CQy4/03.jpg",
        cities: [
          { id: "1", left: "50%", top: "47%" },
          { id: "2", left: "50%", top: "87.5%" },
          { id: "3", left: "50.15%", top: "10%" },
          { id: "4", left: "11.29%", top: "48.3%" },
          { id: "5", left: "88.95%", top: "48.3%" }
        ]
      },
      "نیمه دارگون": {
        title: "پادشاهی نیمه دراگون‌ها",
        mapSrc: "https://i.ibb.co/B2GKjhvk/Dragon.jpg",
        cities: [
          { id: "1", left: "51.4%", top: "41%" },
          { id: "2", left: "50.2%", top: "80.3%" },
          { id: "3", left: "47.7%", top: "14%" },
          { id: "4", left: "11.5%", top: "51%" },
          { id: "5", left: "86.75%", top: "50%" }
        ]
      },
      "الف": {
        title: "پادشاهی الف‌ها",
        mapSrc: "https://imglink.cc/cdn/JS4Lj_e7Re.jpg",
        cities: [
          { id: "1", left: "50%", top: "44%" },
          { id: "2", left: "49.49%", top: "14%" },
          { id: "3", left: "49.99%", top: "82.5%" },
          { id: "4", left: "12.4%", top: "47.5%" },
          { id: "5", left: "88.31%", top: "47.5%" }
        ]
      },
      "فرشته": {
        title: "پادشاهی فرشته‌ها",
        mapSrc: "https://i.ibb.co/4n11Tjdr/05.jpg",
        cities: [
          { id: "1", left: "50.2%", top: "39%" },
          { id: "2", left: "50.1%", top: "79%" },
          { id: "3", left: "50.2%", top: "10%" },
          { id: "4", left: "11.5%", top: "42%" },
          { id: "5", left: "89.45%", top: "43%" }
        ]
      }
    };

    const raceThemes = {
      "انسان": "radial-gradient(120% 80% at 50% 10%, #3a2a18, #120c08 70%)",
      "دروف": "radial-gradient(120% 80% at 50% 10%, #3a2814, #0c0806 70%)",
      "نیمه انسان": "radial-gradient(120% 80% at 50% 10%, #243018, #080a06 70%)",
      "نیمه دارگون": "radial-gradient(120% 80% at 50% 10%, #3a1010, #0a0404 70%)",
      "الف": "radial-gradient(120% 80% at 50% 10%, #143024, #06120c 70%)",
      "فرشته": "radial-gradient(120% 80% at 50% 10%, #2a3048, #080a14 70%)"
    };

    const magicThemes = {
      "آتش": "radial-gradient(120% 80% at 50% 80%, #5a1800, #120404 70%)",
      "آب": "radial-gradient(120% 80% at 50% 80%, #063048, #040a14 70%)",
      "باد": "radial-gradient(120% 80% at 50% 80%, #204040, #061010 70%)",
      "خاک": "radial-gradient(120% 80% at 50% 80%, #3a2c10, #100c06 70%)",
      "نور": "radial-gradient(120% 80% at 50% 80%, #4a4018, #121008 70%)",
      "تاریکی": "radial-gradient(120% 80% at 50% 80%, #1a1028, #040308 70%)"
    };

    let playerName = '';
    let selectedRace = null;
    let selectedGender = null;
    let selectedMagic = null;

    const nameScreen = document.getElementById('nameScreen');
    const raceScreen = document.getElementById('raceScreen');
    const magicScreen = document.getElementById('magicScreen');
    const kingdomScreen = document.getElementById('kingdomScreen');
    const input = document.getElementById('gameInput');
    const nameConfirmBtn = document.getElementById('nameConfirmBtn');
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(msg, duration = 2800) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function goToScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    // ===== نام =====
    // اگر نام قبلاً ذخیره شده باشد، آن را در input نمایش می‌دهیم
    const savedName = localStorage.getItem('ardiyan_playerName');
    if (savedName) {
      input.value = savedName;
    }

    function confirmName() {
      const name = input.value.trim();
      if (!name) { showToast('لطفاً نام خود را وارد کنید'); input.focus(); return; }
      if (name.length < 2) { showToast('نام باید حداقل ۲ حرف باشد'); return; }
      playerName = name;
      localStorage.setItem('ardiyan_playerName', playerName);
      nameConfirmBtn.classList.remove('pulse');
      void nameConfirmBtn.offsetWidth;
      nameConfirmBtn.classList.add('pulse');
      showToast('درود ' + playerName + '! در حال ورود به دنیای آردیان...');
      setTimeout(() => {
        goToScreen(raceScreen);
        document.getElementById('playerNameBadge').textContent = playerName;
      }, 1200);
    }
    nameConfirmBtn.addEventListener('click', confirmName);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });

    // ذرات
    const fx = document.getElementById('fx');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const fire = i % 2 === 0;
      const size = (2 + Math.random() * 3).toFixed(1);
      if (fire) {
        p.style.left = (78 + Math.random() * 18) + '%';
        p.style.top = (50 + Math.random() * 40) + '%';
        p.style.background = 'radial-gradient(circle, #ffd9a0, #ff7a1a)';
        p.style.boxShadow = '0 0 8px rgba(255,130,30,.8)';
      } else {
        p.style.left = (3 + Math.random() * 16) + '%';
        p.style.top = (8 + Math.random() * 38) + '%';
        p.style.background = 'radial-gradient(circle, #eaf6ff, #58b1ff)';
        p.style.boxShadow = '0 0 8px rgba(90,180,255,.8)';
      }
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.setProperty('--o', (0.35 + Math.random() * 0.4).toFixed(2));
      p.style.setProperty('--dy', '-' + Math.round(160 + Math.random() * 180) + 'px');
      p.style.animationDuration = (4 + Math.random() * 5).toFixed(2) + 's';
      p.style.animationDelay = (-Math.random() * 6).toFixed(2) + 's';
      fx.appendChild(p);
    }

    // ===== نژاد =====
    const raceButtons = document.querySelectorAll('.race-btn');
    const genderButtons = document.querySelectorAll('.gender-btn');
    const genderBox = document.getElementById('genderBox');
    const raceConfirmBtn = document.getElementById('raceConfirmBtn');
    const gameContainer = document.getElementById('gameContainer');

    function resetRaceScreen() {
      raceButtons.forEach(b => b.classList.remove('selected'));
      genderButtons.forEach(b => b.classList.remove('selected'));
      genderBox.style.display = 'none';
      raceConfirmBtn.disabled = true;
      selectedRace = null;
      selectedGender = null;
      gameContainer.style.background = 'radial-gradient(120% 80% at 50% 20%, #2a2418, #0a0806 70%)';
    }

    raceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        raceButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedRace = btn.getAttribute('data-race');
        gameContainer.style.background = raceThemes[selectedRace] || gameContainer.style.background;
        genderBox.style.display = 'flex';
        selectedGender = null;
        genderButtons.forEach(b => b.classList.remove('selected'));
        raceConfirmBtn.disabled = true;
      });
    });

    genderButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        genderButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedGender = btn.getAttribute('data-gender');
        raceConfirmBtn.disabled = false;
      });
    });

    raceConfirmBtn.addEventListener('click', () => {
      if (!selectedRace || !selectedGender) return;
      localStorage.setItem('ardiyan_race', selectedRace);
      localStorage.setItem('ardiyan_gender', selectedGender);
      showToast('نژاد و جنسیت ثبت شد. حالا جادو را انتخاب کن!', 2000);
      setTimeout(() => {
        goToScreen(magicScreen);
        magicBtns.forEach(b => b.classList.remove('selected'));
        selectedMagic = null;
        magicConfirmBtn.disabled = true;
        magicInfo.textContent = 'جادوی مورد نظر خود را انتخاب کنید';
        magicContainer.style.background = 'radial-gradient(120% 80% at 50% 10%, #1a1428, #05040a 70%)';
      }, 900);
    });

    document.getElementById('backToRaceBtn').addEventListener('click', () => {
      resetRaceScreen();
      goToScreen(raceScreen);
      showToast('به صفحه انتخاب نژاد برگشتی.', 2000);
    });

    // ===== جادو =====
    const magicBtns = document.querySelectorAll('.magic-btn');
    const magicConfirmBtn = document.getElementById('magicConfirmBtn');
    const magicContainer = document.getElementById('magicContainer');
    const magicInfo = document.getElementById('magicInfo');

    magicBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        magicBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedMagic = btn.getAttribute('data-magic');
        magicContainer.style.background = magicThemes[selectedMagic] || magicContainer.style.background;
        magicInfo.textContent = 'جادوی انتخاب‌شده: ' + selectedMagic;
        magicConfirmBtn.disabled = false;
      });
    });

    magicConfirmBtn.addEventListener('click', () => {
      if (!selectedMagic || !selectedRace) return;
      localStorage.setItem('ardiyan_magic', selectedMagic);
      showToast('جادوی ' + selectedMagic + ' انتخاب شد! ورود به پادشاهی...', 2000);
      setTimeout(() => {
        openKingdom(selectedRace);
      }, 900);
    });

    // ===== نقشه پادشاهی (بدون دکمه بازگشت) =====
    let panzoom = null;
    let coverScale = 1;
    let isUserZooming = false;
    let isInitializing = false;
    let loadAttempts = 0;
    const MAX_ATTEMPTS = 3;
    let resizeTimer = null;
    let initTimeoutId = null;
    let needsResizeAfterZoom = false;

    const mapImg = document.getElementById('kingdom-map');
    const mapWrapper = document.getElementById('kingdom-map-wrapper');
    const mapContainer = document.getElementById('kingdom-map-container');
    const errorDiv = document.getElementById('kingdom-error');
    const errorText = document.getElementById('kingdom-error-text');
    const kingdomTitle = document.getElementById('kingdomTitle');

    function showMapError(msg) {
      mapImg.classList.add('hidden');
      mapWrapper.querySelectorAll('.city-hit').forEach(el => el.style.display = 'none');
      errorText.textContent = msg || 'خطا در بارگذاری نقشه';
      errorDiv.style.display = 'block';
    }
    function hideMapError() {
      mapImg.classList.remove('hidden');
      mapWrapper.querySelectorAll('.city-hit').forEach(el => el.style.display = '');
      errorDiv.style.display = 'none';
    }

    function destroyPanzoom() {
      if (panzoom) {
        try { panzoom.destroy(); } catch (e) {}
        panzoom = null;
      }
      isUserZooming = false;
      needsResizeAfterZoom = false;
    }

    function calcCoverScale() {
      if (!mapImg.naturalWidth || !mapImg.naturalHeight) return 1;
      return Math.max(window.innerWidth / mapImg.naturalWidth, window.innerHeight / mapImg.naturalHeight);
    }

    function buildCities(cities) {
      mapWrapper.querySelectorAll('.city-hit').forEach(el => el.remove());
      cities.forEach(c => {
        const hit = document.createElement('button');
        hit.type = 'button';
        hit.className = 'city-hit';
        hit.style.left = c.left;
        hit.style.top = c.top;
        hit.setAttribute('data-city', c.id);
        hit.innerHTML = '<span class="city-icon"></span>';
        hit.addEventListener('click', e => {
          e.stopPropagation();
          showToast('وارد شهر شماره ' + c.id + ' شدی!');
        });
        mapWrapper.appendChild(hit);
      });
    }

    function initPanzoom() {
      if (isInitializing) return;
      isInitializing = true;
      if (initTimeoutId) { clearTimeout(initTimeoutId); initTimeoutId = null; }
      destroyPanzoom();

      if (!mapImg.naturalWidth || !mapImg.naturalHeight) {
        if (loadAttempts < MAX_ATTEMPTS) {
          loadAttempts++;
          isInitializing = false;
          initTimeoutId = setTimeout(initPanzoom, 1200);
        } else {
          showMapError('نقشه بارگذاری نشد. لطفاً دوباره تلاش کنید.');
          isInitializing = false;
        }
        return;
      }

      loadAttempts = 0;
      hideMapError();
      coverScale = calcCoverScale();
      if (coverScale < 0.1) coverScale = 1;

      mapWrapper.style.width = mapImg.naturalWidth + 'px';
      mapWrapper.style.height = mapImg.naturalHeight + 'px';

      try {
        if (typeof Panzoom === 'undefined') {
          showMapError('کتابخانه نقشه بارگذاری نشد.');
          isInitializing = false;
          return;
        }
        const minScale = coverScale * 0.5;
        const maxScale = Math.max(coverScale * 5, 12);
        panzoom = Panzoom(mapWrapper, {
          startScale: coverScale,
          minScale: minScale,
          maxScale: maxScale,
          contain: 'outside',
          cursor: 'grab',
          touchAction: 'none',
          animate: false,
          duration: 150,
          wheel: true
        });
        const centerX = (mapImg.naturalWidth * coverScale - window.innerWidth) / 2;
        const centerY = (mapImg.naturalHeight * coverScale - window.innerHeight) / 2;
        panzoom.pan(-centerX, -centerY, { animate: false });

        mapWrapper.addEventListener('panzoomstart', () => { isUserZooming = true; });
        mapWrapper.addEventListener('panzoomend', () => {
          isUserZooming = false;
          if (needsResizeAfterZoom) {
            needsResizeAfterZoom = false;
            handleResize();
          }
        });
      } catch (e) {
        showMapError('خطا در راه‌اندازی نقشه: ' + e.message);
      } finally {
        isInitializing = false;
      }
    }

    function handleResize() {
      if (!panzoom) return;
      if (isUserZooming) { needsResizeAfterZoom = true; return; }
      const newCover = calcCoverScale();
      if (Math.abs(newCover - coverScale) < 0.015) return;
      const currentScale = panzoom.getScale();
      const ratio = currentScale / coverScale;
      coverScale = newCover;
      const minScale = coverScale * 0.5;
      const maxScale = Math.max(coverScale * 5, 12);
      let newScale = Math.min(Math.max(ratio * coverScale, minScale), maxScale);
      panzoom.setOptions({ minScale, maxScale });
      panzoom.zoomTo(newScale, {
        animate: true, duration: 200,
        focal: { x: window.innerWidth / 2, y: window.innerHeight / 2 }
      });
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(handleResize, 280);
    });

    mapImg.addEventListener('load', () => {
      loadAttempts = 0;
      if (!isInitializing) initPanzoom();
    });
    mapImg.addEventListener('error', () => {
      showMapError('نقشه پیدا نشد. اتصال اینترنت را بررسی کنید.');
    });

    document.getElementById('kingdom-retry-btn').addEventListener('click', () => {
      if (isInitializing) return;
      loadAttempts = 0;
      destroyPanzoom();
      hideMapError();
      const base = mapImg.src.split('?')[0];
      mapImg.src = base + '?t=' + Date.now();
    });

    // حذف کامل دکمه بازگشت از صفحه نقشه (هیچ المانی با کلاس map-back-btn وجود ندارد)

    function openKingdom(race) {
      const data = KINGDOMS[race];
      if (!data) {
        showToast('نقشه این نژاد پیدا نشد.');
        return;
      }
      goToScreen(kingdomScreen);
      kingdomTitle.textContent = data.title;
      destroyPanzoom();
      loadAttempts = 0;
      hideMapError();
      buildCities(data.cities);
      mapImg.src = data.mapSrc + (data.mapSrc.includes('?') ? '&' : '?') + 't=' + Date.now();
      setTimeout(() => {
        if (mapImg.complete && mapImg.naturalWidth > 0) initPanzoom();
      }, 300);
    }

    // تلگرام
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      try {
        Telegram.WebApp.setHeaderColor('#0a0a0f');
        Telegram.WebApp.setBackgroundColor('#0a0a0f');
      } catch (e) {}
    }
  </script>
